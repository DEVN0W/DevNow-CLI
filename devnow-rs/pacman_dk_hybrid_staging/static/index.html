<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maze Forge Hybrid</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">Python Browser Arcade</p>
      <h1>Maze Forge Hybrid</h1>
      <p class="lede">
        Chase pellets through a neon maze, then scale a hazard-stacked tower before the loop resets harder.
      </p>
    </section>
    <section class="game-panel">
      <canvas id="game" width="960" height="640" aria-label="Maze Forge Hybrid game area"></canvas>
      <div class="controls">
        <span><strong>Move</strong> Arrows or WASD</span>
        <span><strong>Jump</strong> Space</span>
        <span><strong>Climb</strong> Up / Down on ladders</span>
        <span><strong>Restart</strong> Enter after game over</span>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
