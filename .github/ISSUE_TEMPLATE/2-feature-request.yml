name: Feature request
description: Propose an improvement to DevNow Agent
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Search existing issues for a similar proposal before opening a new one.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation should DevNow solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
