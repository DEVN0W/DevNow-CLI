name: Documentation issue
description: Report missing, incorrect, or confusing DevNow documentation
labels: [docs]
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link the page or provide the file path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs improvement?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
