model = "gpt-5.4"
service_tier = "fast"

# Keep the normal chat/default path on OpenAI or Azure OpenAI.
# Multi-agent rosters can point individual agents at Foundry-only providers below.

[model_providers.azure-openai]
name = "Azure OpenAI"
base_url = "https://<your-resource>.openai.azure.com/openai"
env_key = "AZURE_OPENAI_API_KEY"
wire_api = "responses"
query_params = { "api-version" = "2025-04-01-preview" }

[model_providers.azure-foundry-architect]
name = "Azure Foundry Architect"
base_url = "https://<your-foundry-project-endpoint>/api/projects/<project-name>"
env_key = "AZURE_FOUNDRY_ARCHITECT_KEY"
wire_api = "responses"
query_params = { "api-version" = "2025-05-01" }
extra_body = { agent_reference = { name = "emea-swd-multi-agent-ai", version = "2", type = "agent_reference" } }

[model_providers.azure-foundry-quality]
name = "Azure Foundry Quality"
base_url = "https://<your-foundry-project-endpoint>/api/projects/<project-name>"
env_key = "AZURE_FOUNDRY_QUALITY_KEY"
wire_api = "responses"
query_params = { "api-version" = "2025-05-01" }
extra_body = { agent_reference = { name = "emea-swd-multi-agent-ai", version = "2", type = "agent_reference" } }

[profiles.default]
model_provider = "azure-openai"

# Consider setting [mcp_servers] here!
